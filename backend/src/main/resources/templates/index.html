
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KitTrack - Controle de Kits</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 16px;
            background: #f5f6fa;
            color: #222;
        }

        h1 { margin-bottom: 6px; }
        .subtitulo { color: #666; margin-bottom: 25px; }

        .painel, .aula, .vazio {
            background: white;
            padding: 20px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .formulario {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: bold;
        }

        input, select {
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font: inherit;
            min-width: 0;
        }

        button {
            border: 0;
            border-radius: 5px;
            padding: 10px 14px;
            cursor: pointer;
            margin: 5px 5px 0 0;
        }

        .salvar { background: #176b42; color: white; }
        .entregar { background: #176b42; color: white; }
        .devolver { background: #2056a8; color: white; }

        .detalhes {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin: 12px 0;
        }

        .status { font-weight: bold; }
        .mensagem { color: #176b42; font-weight: bold; }
        .erro { color: #b42318; font-weight: bold; }

        .acoes { margin-top: 14px; }
    </style>
</head>
<body>
    <h1>KitTrack</h1>
    <p class="subtitulo">
        Controle de distribuição e devolução dos kits de transmissão.
    </p>

    <p class="mensagem" th:if="${mensagem}" th:text="${mensagem}"></p>
    <p class="erro" th:if="${erro}" th:text="${erro}"></p>

    <section class="painel">
        <h2>Cadastrar transmissor</h2>

        <form th:action="@{/transmissores}" method="post">
            <div class="formulario">
                <label>
                    Nome do transmissor
                    <input type="text" name="nome" maxlength="100"
                           required placeholder="Ex.: João Silva">
                </label>
            </div>

            <button class="salvar" type="submit">
                Cadastrar transmissor
            </button>
        </form>
    </section>

    <section class="painel">
        <h2>Cadastrar aula e montar kit</h2>

        <form th:action="@{/aulas}" method="post">
            <div class="formulario">
                <label>
                    Transmissor
                    <select name="transmissor" required>
                        <option value="">Selecione</option>
                        <option th:each="nome : ${transmissores}"
                                th:value="${nome}"
                                th:text="${nome}">
                        </option>
                    </select>
                </label>

                <label>
                    Data da aula
                    <input type="date" name="data" required>
                </label>

                <label>
                    Horário de início
                    <input type="time" name="inicio" required>
                </label>

                <label>
                    Horário de fim
                    <input type="time" name="fim" required>
                </label>

                <label>
                    Sala
                    <input type="text" name="sala" maxlength="50"
                           required placeholder="Ex.: SALA-101">
                </label>

                <label>
                    Câmeras
                    <input type="number" name="camera" min="0"
                           value="1" required>
                </label>

                <label>
                    Microfones
                    <input type="number" name="microfone" min="0"
                           value="1" required>
                </label>

                <label>
                    Passadores
                    <input type="number" name="passador" min="0"
                           value="1" required>
                </label>

                <label>
                    Pincéis
                    <input type="number" name="pincel" min="0"
                           value="3" required>
                </label>
            </div>

            <button class="salvar" type="submit">
                Cadastrar aula e criar kit
            </button>
        </form>
    </section>

    <h2>Aulas cadastradas</h2>

    <div th:if="${#lists.isEmpty(aulas)}" class="vazio">
        Nenhuma aula cadastrada.
    </div>

    <section th:each="aula : ${aulas}" class="aula">
        <h2 th:text="${aula.transmissor}">Transmissor</h2>

        <div class="detalhes">
            <span>
                Data: <strong th:text="${aula.dataAula}"></strong>
            </span>

            <span>
                Horário:
                <strong th:text="${aula.horarioInicio}"></strong> -
                <strong th:text="${aula.horarioFim}"></strong>
            </span>

            <span>
                Sala: <strong th:text="${aula.sala}"></strong>
            </span>
        </div>

        <p>
            Itens do kit: <strong th:text="${aula.itens}"></strong>
        </p>

        <p>
            Status do kit:
            <span class="status"
                  th:text="${aula.statusKit ?: 'SEM KIT'}"></span>
        </p>

        <div class="acoes">
            <form th:if="${aula.kitId != null and aula.statusKit == 'PENDENTE'}"
                  th:action="@{/kits/{id}/entregar(id=${aula.kitId})}"
                  method="post">
                <button class="entregar" type="submit">
                    Registrar entrega
                </button>
            </form>

            <form th:if="${aula.kitId != null and aula.statusKit == 'ENTREGUE'}"
                  th:action="@{/kits/{id}/devolver(id=${aula.kitId})}"
                  method="post">
                <button class="devolver" type="submit">
                    Registrar devolução
                </button>
            </form>

            <p th:if="${aula.statusKit == 'DEVOLVIDO'}">
                Kit devolvido com sucesso.
            </p>
        </div>
    </section>
</body>
</html>
